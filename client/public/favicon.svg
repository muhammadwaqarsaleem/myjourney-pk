<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background Badge: Rich emerald green rounded shield / circular crest -->
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#022c22" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Crest Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#crestGrad)" stroke="#10b981" stroke-width="1.5"/>

  <!-- Subtle Outer Compass Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- Compass Cardinal Ticks -->
  <line x1="32" y1="7" x2="32" y2="10" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="57" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="32" x2="10" y2="32" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="57" y2="32" stroke="#34d399" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stylized Mountain Peaks (K2 / Karakoram Range) -->
  <!-- Left Mountain Peak -->
  <polygon points="12,48 24,28 36,48" fill="#065f46" opacity="0.8"/>
  <polygon points="24,28 28,35 24,37 20,35" fill="url(#peakGrad)"/>
  
  <!-- Right Mountain Peak -->
  <polygon points="28,48 44,24 56,48" fill="#047857"/>
  <polygon points="44,24 49,32 44,35 39,32" fill="url(#peakGrad)"/>
  
  <!-- Central Majestic Mountain Peak (Front) -->
  <polygon points="18,48 32,20 46,48" fill="#022c22" filter="url(#shadow)"/>
  <!-- Snow Cap on Central Peak -->
  <polygon points="32,20 37,29 33,32 30,30 27,29" fill="url(#peakGrad)"/>

  <!-- Celestial Crescent & Star Motif (Pakistan Tourism Emblem) -->
  <!-- Elegant Crescent Moon -->
  <path d="M 40,11 A 11,11 0 1 0 49,27 A 9,9 0 1 1 40,11 Z" fill="url(#goldAccent)"/>
  
  <!-- Compass Star / Five-Pointed Star -->
  <polygon points="44,14 45.3,17.2 48.7,17.4 46,19.6 47,23 44,21 41,23 42,19.6 39.3,17.4 42.7,17.2" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Clean Base Horizon Arc -->
  <path d="M 10,48 Q 32,52 54,48" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
</svg>
